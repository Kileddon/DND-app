[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tabletop-companion"
version = "0.1.0"
description = "Local-first host service for live tabletop role-playing games"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "qrcode[pil]>=8.2,<9",
    "sqlalchemy>=2.0.41,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
tabletop-companion = "tabletop_companion.main:main"

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "types-qrcode>=8.2,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tabletop_companion"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true
